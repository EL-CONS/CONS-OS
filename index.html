<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>CONS-OS</title>
    <link rel="stylesheet" href="./style.css">
</head>
<div class="cons"></div>
<body>
    <div class="navBar">
        <div class="start-button" id="start-button">CONS-OS
            <ul id="dropdown-menu" class="hidden">
                <li class="menu-item app-link" data-target="terminal-window">Terminal</li>
                
                <li class="menu-item app-link" data-target="color-settings-window">color settings</li>

                <!-- <li class="menu-item app-link" data-target="notes-window">Notes</li> -->
            </ul>
        </div>
        <div class="clock" id="clock"></div>
    </div>
    

    
    <div class="window hidden" id="terminal-window">
        <div class="window-header">
            <span>Terminal</span>
            <button class="close-btn">X</button>
        </div>
        
        <div class="window-content" id="terminal">
            
            <div>Type "help" for available commands.</div>
            <div>
                <span>user@CONS-OS:~$ </span>
                <input id="command" onkeyup="javascript:this.value=this.value.toUpperCase();">
            </div>
        </div>
    </div>
    
    <div class="window hidden" id="color-settings-window">
         <div class="window-header">
            <span>color settings</span>
               <button class="close-btn">X</button>
         </div>

<select id="color-settings-window">
  <option value="gray-lcd">gray-lcd</option>
  <!-- The value here MUST match the string inside your CSS [data-theme="..."] -->
  <option value="blue-lcd">blue-lcd</option> 
  <option value="green-lcd">green-lcd</option> 
</select>

         


    </div>








    <script src="script.js"></script>
</body>
</html>
